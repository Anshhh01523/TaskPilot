<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        fetch('http://localhost:5000/api/log', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({error: e.message, filename: e.filename, lineno: e.lineno, stack: e.error ? e.error.stack : ''})
        }).catch(console.error);
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('http://localhost:5000/api/log', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({error: e.reason ? e.reason.message : 'Unhandled Promise Rejection', stack: e.reason ? e.reason.stack : ''})
        }).catch(console.error);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
